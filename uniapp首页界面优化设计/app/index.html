<style>

<h1>know-uniapp 首页全新设计</h1>
<div class="sub">同一套内容元素 · 四种完全不同的布局骨架</div>
<div class="grid">
  <a class="card" href="./design-1.html"><div class="num">DESIGN 01</div><div class="t">数据仪表盘风</div><div class="d">环形进度 + 迷你趋势图 + KPI 条卡，像 Notion / 飞书仪表盘，数据感最强</div><span class="tag">数据驱动</span></a>
  <a class="card" href="./design-2.html"><div class="num">DESIGN 02</div><div class="t">卡片流极简风</div><div class="d">今日 3 件事超大卡置顶，其余内容收进 Tab 分区（纯 CSS 可点切换），首屏极简</div><span class="tag">极简聚焦</span></a>
