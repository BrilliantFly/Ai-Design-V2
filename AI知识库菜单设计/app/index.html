<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 知识库菜单设计 · 原型预览</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: #1F2329;
            margin-bottom: 12px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #646A73;
            margin-bottom: 48px;
            font-size: 14px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .card-icon { font-size: 48px; margin-bottom: 16px; }
        .card-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 8px;
            margin-left: 4px;
        }
        .tag-vue { background: #E8F4FD; color: #1890ff; }
        .tag-uniapp { background: #FFF3E0; color: #E67E22; }
        .tag-both { background: #E8F8EF; color: #25B864; }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1F2329;
            margin-bottom: 8px;
        }
        .card-desc {
            font-size: 14px;
            color: #646A73;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            margin-top: 48px;
            color: #8F959E;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 AI 知识库菜单设计 · 原型预览</h1>
        <p class="subtitle">文件上传 + HTML/MD 双端预览 · 设计稿</p>
        <div class="grid">
            <a href="file-upload.html" class="card">
                <div class="card-icon">📤</div>
                <span class="card-tag tag-both">Vue + UniApp</span>
                <div class="card-title">文件导入页</div>
                <div class="card-desc">大拖入区 + 知识库选择 + 批量上传进度 + 最近上传记录</div>
            </a>
            <a href="file-preview.html" class="card">
                <div class="card-icon">👁</div>
                <span class="card-tag tag-both">Vue + UniApp</span>
                <div class="card-title">文件预览页</div>
                <div class="card-desc">HTML 用 iframe / web-view / rich-text；MD 用 marked.js 解析</div>
            </a>
            <a href="vue-file-list.html" class="card">
                <div class="card-icon">🗂</div>
                <span class="card-tag tag-vue">Vue 管理端</span>
                <div class="card-title">文件管理列表</div>
                <div class="card-desc">侧边栏菜单、拖拽上传、解析状态筛选、批量操作</div>
            </a>
        </div>
        <p class="footer">设计版本 V1.0 · 2026-10-13 · 与 know-vue / know-uniapp / know-boot-knowledge 对齐</p>
    </div>
</body>
</html>
